name = "bitcoin_wire_examples"
version = "1.0.0"

description = "Live-data command-line examples for bitcoin_wire."
gleam = ">= 1.16.0"

target = "erlang"
internal_modules = [
  "bitcoin_wire_examples/internal",
  "bitcoin_wire_examples/internal/*",
]

[dependencies]
bitcoin_wire = { path = ".." }
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
argv = ">= 1.0.2 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
