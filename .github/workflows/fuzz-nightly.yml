# At 1 a.m. Central, run deep fuzzing only when main differs from the latest
# successful scheduled run. Successful skipped runs retain the already-tested
# SHA. Failed runs leave the new SHA eligible for retry the following night.
# All targets share a generated seed so they replay the same mutations.
name: fuzz-nightly

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: "America/Chicago"

permissions:
  contents: read
  actions: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  prepare:
    name: check main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      run_fuzz: ${{ steps.changes.outputs.run_fuzz }}
      seed: ${{ steps.generate.outputs.seed }}

    steps:
      - name: Check for untested commits
        id: changes
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'fuzz-nightly.yml',
              branch: 'main',
              event: 'schedule',
              status: 'success',
              per_page: 1,
            });
            const lastSuccessful = data.workflow_runs[0];
            const runFuzz = !lastSuccessful || lastSuccessful.head_sha !== context.sha;
            core.setOutput('run_fuzz', String(runFuzz));
            core.info(runFuzz
              ? `Running deep fuzz for untested commit ${context.sha}`
              : `Skipping deep fuzz: ${context.sha} already passed`);

      - name: Generate seed
        if: steps.changes.outputs.run_fuzz == 'true'
        id: generate
        run: echo "seed=$(od -An -N4 -td4 < /dev/urandom | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  deep-fuzz:
    name: deep fuzz (${{ matrix.suite }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.run_fuzz == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: transaction
            platform: erlang
            target: erlang
            iterations: 1000000
          - suite: block
            platform: erlang
            target: erlang
            iterations: 100000
          - suite: transaction
            platform: javascript, node
            target: javascript
            js_runtime: node
            iterations: 1000000
          - suite: block
            platform: javascript, node
            target: javascript
            js_runtime: node
            iterations: 100000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup runtimes
        uses: ./.github/actions/setup
        with:
          js_runtime: ${{ matrix.js_runtime }}

      - name: Download fuzz dependencies
        working-directory: fuzz
        run: gleam deps download

      - name: Run deep fuzz test
        timeout-minutes: 90
        run: |
          if [ "${{ matrix.target }}" = "javascript" ]; then
            ./fuzz/run --target javascript --runtime ${{ matrix.js_runtime }} -- ${{ matrix.suite }} ${{ matrix.iterations }} ${{ needs.prepare.outputs.seed }}
          else
            ./fuzz/run --target erlang -- ${{ matrix.suite }} ${{ matrix.iterations }} ${{ needs.prepare.outputs.seed }}
          fi
