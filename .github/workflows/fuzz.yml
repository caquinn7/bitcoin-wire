name: fuzz

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: fuzz format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup formatter
        uses: ./.github/actions/setup
        with:
          gleam_version: "1.19.1"

      - name: Check formatting
        working-directory: fuzz
        run: gleam format --check

  smoke:
    name: fuzz smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: erlang
            target: erlang
          - platform: node
            target: javascript
            js_runtime: node
            runtime_options: --runtime node

    steps:
      - uses: actions/checkout@v7

      - name: Setup runtimes
        uses: ./.github/actions/setup
        with:
          js_runtime: ${{ matrix.js_runtime }}

      - name: Download dependencies
        working-directory: fuzz
        run: gleam deps download

      - name: Build project
        working-directory: fuzz
        run: gleam build --target ${{ matrix.target }}

      - name: Smoke test transactions
        run: ./fuzz/run --target ${{ matrix.target }} ${{ matrix.runtime_options }} -- transaction 100 12345

      - name: Smoke test blocks
        run: ./fuzz/run --target ${{ matrix.target }} ${{ matrix.runtime_options }} -- block 10 12345
