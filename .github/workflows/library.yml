name: library

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: library format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup formatter
        uses: ./.github/actions/setup
        with:
          gleam_version: "1.19.1"

      - name: Check formatting
        run: gleam format --check src test

  test:
    name: library tests (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: erlang
            target: erlang
          - platform: node
            target: javascript
            js_runtime: node
            runtime_options: --runtime node

    steps:
      - uses: actions/checkout@v4

      - name: Setup runtimes
        uses: ./.github/actions/setup
        with:
          js_runtime: ${{ matrix.js_runtime }}

      - name: Download dependencies
        run: gleam deps download

      - name: Run tests
        run: gleam test --target ${{ matrix.target }} ${{ matrix.runtime_options }}
