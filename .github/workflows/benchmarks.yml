name: benchmarks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: benchmarks format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup formatter
        uses: ./.github/actions/setup
        with:
          gleam_version: "1.19.1"

      - name: Check formatting
        working-directory: benchmarks
        run: gleam format --check

  smoke:
    name: benchmarks smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: erlang
            target: erlang
          - platform: node
            target: javascript
            js_runtime: node
            runtime_options: --runtime node

    steps:
      - uses: actions/checkout@v4

      - name: Setup runtimes
        uses: ./.github/actions/setup
        with:
          js_runtime: ${{ matrix.js_runtime }}

      - name: Download dependencies
        working-directory: benchmarks
        run: gleam deps download

      - name: Build project
        working-directory: benchmarks
        run: gleam build --target ${{ matrix.target }}

      - name: Smoke test fixture benchmarks
        run: |
          ./benchmarks/run --target ${{ matrix.target }} ${{ matrix.runtime_options }} -- \
            --section transaction.deserialize.fixtures \
            --section block.deserialize.fixtures
