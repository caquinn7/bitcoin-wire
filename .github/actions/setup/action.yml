name: Setup runtimes
description: Sets up Node (conditionally) and BEAM toolchain

inputs:
  js_runtime:
    description: JavaScript runtime to set up (node or empty for Erlang-only)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      if: inputs.js_runtime == 'node'
      uses: actions/setup-node@v4
      with:
        node-version: "25.9.0"

    - name: Setup BEAM
      uses: erlef/setup-beam@v1
      with:
        otp-version: "28.5"
        gleam-version: "1.16.0"
        rebar3-version: "3.27.0"
        version-type: strict
