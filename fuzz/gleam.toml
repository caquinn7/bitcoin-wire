name = "bitcoin_wire_fuzz"
version = "1.0.0"

gleam = ">= 1.16.0"

target = "erlang"
internal_modules = [
  "bitcoin_wire_fuzz/internal",
  "bitcoin_wire_fuzz/internal/*",
]

[javascript]
runtime = "node"
source_maps = true

[javascript.deno]
allow_read = true

[dependencies]
bitcoin_wire = { path = ".." }
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_crypto = ">= 1.5.1 and < 2.0.0"
argv = ">= 1.0.2 and < 2.0.0"
exception = ">= 2.1.0 and < 3.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
